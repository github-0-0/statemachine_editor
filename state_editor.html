<html>
    <head>
        <title>staticvoid</title>
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="nav" id="nav">S T A T I C   V O I D</div>
        <div class="main">
            <div class="side">
                <details class="selection states" id="states">
                    <summary class="selection-summary glass">states</summary>
                    <div class="selection-body">
                        <div id="addState" class="state states glass">
                            <div class="leftright">Add State <button onclick="StateData.addState()" style="height: 24px">==></button></div>
                            <div class="leftright">Name: <input id="stateName" type="text" style="height: 24px"placeholder="name"></div>
                        </div>
                    </div>
                </details>
                <details class="selection triggers" id="triggers">
                    <summary class="selection-summary glass">triggers</summary>
                    <div class="selection-body">
                        <div id="addTrigger" class="trigger triggers glass">
                            <div class="leftright">Add Trigger <button onclick="TriggerData.addTrigger()" style="height: 24px">==></button></div>
                            <div class="leftright">Name: <input id="triggerName" type="text" style="height: 24px" placeholder="name"></div><hr>
                            <div class="leftright">Add Additional Property: <button onclick="TriggerData.addTriggerProperty()" style="height: 24px">+</button></div> 
                        </div>
                    </div>
                </details>
            </div>
            <div class="container">
                <div class="board" id="board" style="width: 1600px; height: 1950px;">
                    <svg id="edges">
                        <defs>
                            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
                                <path d="M0 0L10 5L0 10z"/>
                            </marker>
                        </defs>
                    </svg>
                </div>
            </div>
            <div class="side">
                <details class="selection subsystems" id="subsystems">
                    <summary class="selection-summary glass">subsystems</summary>
                    <div class="selection-body">
                        <div id="addSubsystem" class="subsystem subsystems glass">
                            <div class="leftright">Add Subsystem <button onclick="SubsystemData.addSubsystem()" style="height: 24px">==></button></div>
                            <div class="leftright">Name: <input id="subsystemName" type="text" style="height: 24px" placeholder="name"></div>
                            <div class="leftright">Add Additional Property: <button onclick="SubsystemData.addSubsystemProperty()" style="height: 24px">+</button></div>
                        </div>
                    </div>  
                </details>
                <details class="selection saves">
                    <summary class="selection-summary glass">saves</summary>
                </details>
            </div>
        </div>
        <template id="tpl-remove-button">
            <button type="button" style="background: none; aspect-ratio: 1.5">&times;</button>
        </template>

        <!-- One "name: type" row in the add-property forms -->
        <template id="tpl-property-row">
            <div class="leftright">
                <input placeholder="name" style="width: 30%; height: 24px">
                <text>: </text>
                <select style="height: 24px"></select>
            </div>
        </template>

        <!-- One "==> key: [input] [x]" row inside a state/trigger card -->
        <template id="tpl-attr-row">
            <hr>
            <text class="attr-row leftright"><input style="width: 30%; min-width: 0"></text>
        </template>

        <!-- Container for a state card's per-subsystem rows -->
        <template id="tpl-subsystem-list">
            <div class="subsystem-rows"></div>
        </template>

        <!-- "==> SUBSYSTEM: [substate dropdown]" row inside a state card -->
        <template id="tpl-subsystem-row">
            <hr>
            <text class="attr-row leftright"><select style="width: 50%; min-width: 0; height: 24px"></select></text>
        </template>

        <!-- Sidebar card with a collapsible list of attributes -->
        <template id="tpl-card-expandable">
            <div class="selection-body">
                <div class="card glass">
                    <details>
                        <summary class="leftright">
                            <text class="card-name"></text>
                            <button type="button" class="insert">==&gt;</button>
                        </summary>
                    </details>
                </div>
            </div>
        </template>

        <!-- Sidebar card with no attributes -->
        <template id="tpl-card-simple">
            <div class="selection-body">
                <div class="card glass leftright">
                    <text class="card-name"></text>
                    <button type="button" class="insert">==&gt;</button>
                </div>
            </div>
        </template>

        <!-- "Add substate" row at the top of a subsystem card -->
        <template id="tpl-substate-add">
            <div class="leftright">
                <input class="substate-input" placeholder="substate name" style="width: 50%; height: 24px">
                <button type="button" class="add-substate" style="height: 24px">+</button>
            </div>
            <hr>
        </template>

        <!-- One substate inside a subsystem card -->
        <template id="tpl-substate">
            <details class="substate">
                <summary class="leftright">
                    <text class="substate-name"></text>
                </summary>
            </details>
        </template>

        <!-- A node on the board -->
        <template id="tpl-node">
            <div style="position: absolute; z-index: 2; cursor: grab; user-select: none; touch-action: none; box-sizing: border-box"></div>
        </template>

        <script src="script.js"></script>
    </body>
</html>
