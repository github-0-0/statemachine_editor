<html>
    <head>
        <title>staticvoid</title>
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="nav" id="nav">S T A T I C   V O I D</div>
        <div class="main">
            <div class="side">
                <details class="selection states" id="states">
                    <summary class="selection-summary">states</summary>
                    <div class="selection-body">
                        <div id="addState" class="state states" >
                            Add State <button onclick="addState()">==></button> <br>
                            Name: <input id="stateName" type="text"> <hr>
                            Add Additional Property: <button onclick="addStateProperty()">+</button>
                        </div>
                    </div>
                </details>
                <details class="selection triggers" id="triggers">
                    <summary class="selection-summary">triggers</summary>
                    <div class="selection-body">
                        <div id="addTrigger" class="trigger triggers">
                            <div>Add Trigger <button onclick="addTrigger()">==></button> <br> </div>
                            Name: <input id="triggerName" type="text"> <hr>
                            Add Additional Property: <button onclick="addTriggerProperty()">+</button>
                        </div>
                    </div>
                </details>
            </div>
            <div class="container">
                <div class="board" id="board" style="width: 1600px; height: 1950px;">
                    <svg id="edges">
                        <defs>
                            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
                                <path d="M0 0L10 5L0 10z"/>
                            </marker>
                        </defs>
                    </svg>
                </div>
            </div>
            <div class="side">
                <details class="selection subsystems">
                    <summary class="selection-summary">subsystems</summary>
                </details>
                <details class="selection saves">
                    <summary class="selection-summary">saves</summary>
                </details>
            </div>
        </div>
        <script src="script.js"></script>
</html>
