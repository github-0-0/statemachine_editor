<html>
    <head>
        <title>staticvoid</title>
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="nav" id="nav">S T A T I C   V O I D</div>
        <div class="main">
            <div class="side">
                <details class="selection states" id="states">
                    <summary class="selection-summary glass">states</summary>
                    <div class="selection-body">
                        <div id="addState" class="state states glass">
                            <div class="leftright">Add State <button onclick="StateData.addState()" style="height: 24px">==></button></div>
                            <div class="leftright">Name: <input id="stateName" type="text" style="height: 24px"placeholder="name"></div><hr />
                            <div class="leftright">Add Additional Property: <button onclick="StateData.addStateProperty()" style="height: 24px">+</button></div>   
                        </div>
                    </div>
                </details>
                <details class="selection triggers" id="triggers">
                    <summary class="selection-summary glass">triggers</summary>
                    <div class="selection-body">
                        <div id="addTrigger" class="trigger triggers glass">
                            <div class="leftright">Add Trigger <button onclick="TriggerData.addTrigger()" style="height: 24px">==></button></div>
                            <div class="leftright">Name: <input id="triggerName" type="text" style="height: 24px" placeholder="name"></div><hr>
                            <div class="leftright">Add Additional Property: <button onclick="TriggerData.addTriggerProperty()" style="height: 24px">+</button></div> 
                        </div>
                    </div>
                </details>
            </div>
            <div class="container">
                <div class="board" id="board" style="width: 1600px; height: 1950px;">
                    <svg id="edges">
                        <defs>
                            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
                                <path d="M0 0L10 5L0 10z"/>
                            </marker>
                        </defs>
                    </svg>
                </div>
            </div>
            <div class="side">
                <details class="selection subsystems">
                    <summary class="selection-summary glass">subsystems</summary>
                </details>
                <details class="selection saves">
                    <summary class="selection-summary glass">saves</summary>
                </details>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
